<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Online | RESTO COMMANDE</title>
<meta name="description" content="Order online for pickup or delivery.">
<meta name="theme-color" content="#c8102e">
<style>
:root{--p:#c8102e;--bg:#faf7f2;--card:#fff;--tx:#1f1f1f;--mut:#6b6b6b;--bd:#e8e2d9}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:90px}
button{font:inherit;cursor:pointer}
.hero{position:relative;min-height:210px;background:#333 center/cover;color:#fff;display:flex;align-items:flex-end}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(0,0,0,.75))}
.hero .in{position:relative;padding:16px;width:100%}
.logo{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff;border:2px solid #fff;margin-bottom:8px}
.hero h1{margin:0;font-size:26px}
.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
.actions{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--p);color:#fff}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.tabs{position:sticky;top:0;z-index:5;background:var(--card);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tabs a{white-space:nowrap;padding:7px 14px;border-radius:20px;background:#f0ebe3;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
.wrap{max-width:760px;margin:0 auto}
h2{margin:22px 16px 8px}
.item{display:flex;gap:12px;background:var(--card);margin:8px 12px;padding:12px;border-radius:14px;border:1px solid var(--bd);cursor:pointer}
.item.off{opacity:.5}
.item .t{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--mut);display:block;margin:3px 0}
.item .pr{font-weight:700;color:var(--p)}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:36px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:var(--card);border-top:1px solid var(--bd);z-index:10}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h3{margin:0 0 8px}
label.opt{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
input,textarea,select{width:100%;padding:11px;border:1px solid #cfc8bd;border-radius:10px;font:inherit;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:18px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--bd);background:#fff;font-weight:600}
.seg button.on{border-color:var(--p);color:var(--p)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.muted{color:var(--mut)}
.center{text-align:center;padding:40px 16px}
.closed{background:#fff3cd;color:#664d03;padding:10px 16px;text-align:center;font-weight:600}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading…</div></div>
<div id="modal"></div>

<script type="module">
import { db } from "./firebase.js";
import { doc, collection, onSnapshot, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const rid = new URLSearchParams(location.search).get("r");
let R = null, items = [], cart = [], mode = "pickup", sel = null;
try { cart = JSON.parse(localStorage.getItem("cart_" + rid) || "[]"); } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "$" + Number(n || 0).toFixed(2);
const $ = id => document.getElementById(id);
const saveCart = () => { try { localStorage.setItem("cart_" + rid, JSON.stringify(cart)); } catch (e) {} };
const EMOJI = { burger: "🍔", sandwich: "🥪", pizza: "🍕", side: "🍟", dessert: "🍰", drink: "🥤" };
const emo = c => { c = (c || "").toLowerCase(); for (const k in EMOJI) if (c.includes(k)) return EMOJI[k]; return "🍽️"; };
const set = () => ({ accepting: true, pickup: true, delivery: true, deliveryFee: 0, taxRate: 0, minOrder: 0, ...(R.settings || {}) });

if (!rid) {
  $("app").innerHTML = '<div class="center"><h1>🍔 RESTO COMMANDE</h1><p>Open your restaurant\'s link to order online.</p></div>';
} else {
  onSnapshot(doc(db, "restaurants", rid), s => {
    R = s.exists() ? s.data() : "none";
    if (R !== "none") {
      document.documentElement.style.setProperty("--p", R.primary || "#c8102e");
      document.title = (R.name || "Restaurant") + " | Order Online";
      seo();
    }
    render();
  }, () => { R = "none"; render(); });
  onSnapshot(collection(db, "restaurants", rid, "items"), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}

function seo() {
  let el = document.getElementById("ld");
  if (!el) { el = document.createElement("script"); el.id = "ld"; el.type = "application/ld+json"; document.head.appendChild(el); }
  el.textContent = JSON.stringify({
    "@context": "https://schema.org", "@type": "Restaurant", name: R.name || "", telephone: R.phone || "",
    address: R.address || "", description: R.description || "", image: R.cover || undefined, servesCuisine: "American"
  });
}

function render() {
  const app = $("app");
  if (R === null) return;
  if (R === "none") { app.innerHTML = '<div class="center"><h2>Restaurant not found</h2></div>'; return; }
  const S = set();
  const cats = (R.categories || []).filter(c => items.some(i => i.category === c));
  const tel = R.phone ? 'href="tel:' + esc(R.phone) + '"' : 'onclick="alert(\'Phone number not available\')"';
  let h = '<div class="hero" style="' + (R.cover ? 'background-image:url(' + esc(R.cover) + ')' : '') + '"><div class="in">' +
    (R.logo ? '<img class="logo" src="' + esc(R.logo) + '" alt="logo">' : '') +
    '<h1>' + esc(R.name) + '</h1><p>' + esc(R.description) + '</p></div></div>';
  if (S.accepting === false) h += '<div class="closed">We are not accepting online orders right now.</div>';
  h += '<div class="actions"><a class="btn pri" ' + tel + '>📞 Call Restaurant</a>' +
    '<a class="btn pri" href="#menu">Order Now</a>' +
    '<a class="btn sec" href="#menu">View Menu</a>' +
    '<button class="btn sec" onclick="openInfo()">Contact Us</button></div>';
  h += '<div class="tabs" id="menu">' + cats.map((c, i) => '<a href="#c' + i + '">' + esc(c) + '</a>').join("") + '</div>';
  cats.forEach((c, i) => {
    h += '<h2 id="c' + i + '">' + esc(c) + '</h2>';
    items.filter(x => x.category === c).forEach(x => {
      h += '<div class="item' + (x.available === false ? ' off' : '') + '" onclick="openItem(\'' + x.id + '\')">' +
        '<div class="t"><b>' + esc(x.name) + '</b><small>' + esc(x.description) + '</small>' +
        '<span class="pr">' + (x.available === false ? 'Sold out' : ((x.sizes && x.sizes.length ? 'From ' : '') + money(x.sizes && x.sizes.length ? Math.min(...x.sizes.map(s => s.price)) : x.price))) + '</span></div>' +
        (x.image ? '<img class="thumb" src="' + esc(x.image) + '" alt="' + esc(x.name) + '">' : '<div class="thumb">' + emo(c) + '</div>') + '</div>';
    });
  });
  if (!cats.length) h += '<div class="center muted">Menu coming soon.</div>';
  h += '<footer>Powered by RESTO COMMANDE</footer>';
  const n = cart.reduce((a, l) => a + l.qty, 0);
  if (n) h += '<div class="bar"><button class="btn pri full" onclick="openCart()">View Cart (' + n + ') · ' + money(sub()) + '</button></div>';
  app.innerHTML = h;
}

const sub = () => cart.reduce((a, l) => a + l.unit * l.qty, 0);

window.openInfo = () => {
  const d = [["mon", "Mon"], ["tue", "Tue"], ["wed", "Wed"], ["thu", "Thu"], ["fri", "Fri"], ["sat", "Sat"], ["sun", "Sun"]];
  const hrs = R.hours ? d.map(([k, n]) => { const x = R.hours[k]; return '<div class="row"><span>' + n + '</span><span>' + (!x || x.closed ? 'Closed' : esc(x.open) + ' – ' + esc(x.close)) + '</span></div>'; }).join("") : "";
  $("modal").innerHTML = '<div class="back" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Contact Us</h3>' +
    (R.phone ? '<p>📞 <a href="tel:' + esc(R.phone) + '">' + esc(R.phone) + '</a></p>' : '') +
    (R.email ? '<p>✉️ <a href="mailto:' + esc(R.email) + '">' + esc(R.email) + '</a></p>' : '') +
    (R.address ? '<p>📍 ' + esc(R.address) + '</p>' : '') +
    (hrs ? '<h3>Opening Hours</h3>' + hrs : '') +
    '<br><button class="btn sec full" onclick="closeM()">Close</button></div></div>';
};
window.closeM = () => { $("modal").innerHTML = ""; };

window.openItem = id => {
  const it = items.find(x => x.id === id);
  if (!it || it.available === false) return;
  sel = { it, size: 0, extras: [], qty: 1, note: "" };
  drawItem();
};
function unitOf() {
  const { it, size, extras } = sel;
  let u = it.sizes && it.sizes.length ? it.sizes[size].price : it.price;
  extras.forEach(i => u += (it.extras[i] || {}).price || 0);
  return u;
}
function drawItem() {
  const { it } = sel;
  let h = '<div class="back" onclick="if(event.target===this)closeM()"><div class="sheet">' +
    (it.image ? '<img src="' + esc(it.image) + '" style="width:100%;border-radius:12px;max-height:200px;object-fit:cover">' : '') +
    '<h3>' + esc(it.name) + '</h3><p class="muted">' + esc(it.description) + '</p>';
  if (it.sizes && it.sizes.length) {
    h += '<b>Size</b>' + it.sizes.map((s, i) => '<label class="opt"><span><input type="radio" name="sz" style="width:auto;margin:0 8px 0 0" ' + (sel.size === i ? 'checked' : '') + ' onchange="selSize(' + i + ')">' + esc(s.name) + '</span><span>' + money(s.price) + '</span></label>').join("");
  }
  if (it.extras && it.extras.length) {
    h += '<br><b>Extras</b>' + it.extras.map((s, i) => '<label class="opt"><span><input type="checkbox" style="width:auto;margin:0 8px 0 0" ' + (sel.extras.includes(i) ? 'checked' : '') + ' onchange="selExtra(' + i + ')">' + esc(s.name) + '</span><span>+' + money(s.price) + '</span></label>').join("");
  }
  h += '<br><b>Special instructions</b><textarea id="note" rows="2" placeholder="No onions, extra sauce…" oninput="sel_note(this.value)">' + esc(sel.note) + '</textarea>' +
    '<div class="row"><div class="qty"><button onclick="selQty(-1)">−</button><b>' + sel.qty + '</b><button onclick="selQty(1)">+</button></div>' +
    '<button class="btn pri" onclick="addCart()">Add · ' + money(unitOf() * sel.qty) + '</button></div></div></div>';
  $("modal").innerHTML = h;
}
window.selSize = i => { sel.size = i; drawItem(); };
window.selExtra = i => { const k = sel.extras.indexOf(i); k >= 0 ? sel.extras.splice(k, 1) : sel.extras.push(i); drawItem(); };
window.selQty = d => { sel.qty = Math.max(1, sel.qty + d); drawItem(); };
window.sel_note = v => { sel.note = v; };
window.addCart = () => {
  const { it } = sel;
  const size = it.sizes && it.sizes.length ? it.sizes[sel.size].name : "";
  const ex = sel.extras.map(i => it.extras[i].name);
  const key = [it.id, size, ex.join("|"), sel.note].join("~");
  const line = cart.find(l => l.key === key);
  if (line) line.qty += sel.qty;
  else cart.push({ key, id: it.id, name: it.name, size, extras: ex, unit: unitOf(), qty: sel.qty, note: sel.note });
  saveCart(); closeM(); render();
};

window.openCart = () => {
  const S = set();
  if (!cart.length) { closeM(); render(); return; }
  if (mode === "pickup" && !S.pickup && S.delivery) mode = "delivery";
  if (mode === "delivery" && !S.delivery && S.pickup) mode = "pickup";
  const fee = mode === "delivery" ? Number(S.deliveryFee) : 0;
  const tax = sub() * Number(S.taxRate) / 100;
  const total = sub() + fee + tax;
  let h = '<div class="back" onclick="if(event.target===this)closeM()"><div class="sheet"><h3>Your Cart</h3>';
  cart.forEach((l, i) => {
    h += '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div><b>' + esc(l.name) + '</b>' + (l.size ? ' <small>(' + esc(l.size) + ')</small>' : '') +
      (l.extras.length ? '<br><small class="muted">+ ' + esc(l.extras.join(", ")) + '</small>' : '') +
      (l.note ? '<br><small class="muted">“' + esc(l.note) + '”</small>' : '') + '<br>' + money(l.unit * l.qty) + '</div>' +
      '<div class="qty"><button onclick="cq(' + i + ',-1)">−</button><b>' + l.qty + '</b><button onclick="cq(' + i + ',1)">+</button></div></div>';
  });
  h += '<br><div class="seg">' + (S.pickup ? '<button class="' + (mode === "pickup" ? "on" : "") + '" onclick="setMode(\'pickup\')">Pickup</button>' : '') +
    (S.delivery ? '<button class="' + (mode === "delivery" ? "on" : "") + '" onclick="setMode(\'delivery\')">Delivery</button>' : '') + '</div>' +
    '<input id="cn" placeholder="Your name" autocomplete="name" value="' + esc(localStorage.getItem("cn") || "") + '">' +
    '<input id="cp" type="tel" placeholder="Phone number" autocomplete="tel" value="' + esc(localStorage.getItem("cp") || "") + '">' +
    '<input id="ce" type="email" placeholder="Email (optional)" autocomplete="email">' +
    (mode === "delivery" ? '<input id="ca" placeholder="Delivery address" autocomplete="street-address">' : '') +
    '<div class="tot"><div><span>Subtotal</span><span>' + money(sub()) + '</span></div>' +
    (mode === "delivery" ? '<div><span>Delivery fee</span><span>' + money(fee) + '</span></div>' : '') +
    '<div><span>Tax</span><span>' + money(tax) + '</span></div>' +
    '<div><b>Total</b><b>' + money(total) + '</b></div></div><br>' +
    '<button class="btn pri full" id="pl" onclick="placeOrder()">Place Order · ' + money(total) + '</button>' +
    '<p class="muted" style="font-size:12px;text-align:center">You pay the restaurant directly when you pick up or receive your order.</p></div></div>';
  $("modal").innerHTML = h;
};
window.cq = (i, d) => { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); saveCart(); openCart(); render(); };
window.setMode = m => { mode = m; openCart(); };

window.placeOrder = async () => {
  const S = set();
  const name = $("cn").value.trim(), phone = $("cp").value.trim(), email = $("ce").value.trim();
  const addr = mode === "delivery" ? $("ca").value.trim() : "";
  if (S.accepting === false) return alert("Sorry, online ordering is currently closed.");
  if (!name || !phone) return alert("Please enter your name and phone number.");
  if (mode === "delivery" && !addr) return alert("Please enter your delivery address.");
  if (sub() < Number(S.minOrder || 0)) return alert("Minimum order is " + money(S.minOrder));
  const fee = mode === "delivery" ? Number(S.deliveryFee) : 0;
  const tax = +(sub() * Number(S.taxRate) / 100).toFixed(2);
  const total = +(sub() + fee + tax).toFixed(2);
  const number = String(Date.now()).slice(-6);
  $("pl").disabled = true; $("pl").textContent = "Sending…";
  try {
    await addDoc(collection(db, "restaurants", rid, "orders"), {
      number, status: "new", type: mode, createdAt: serverTimestamp(),
      customer: { name, phone, email, address: addr },
      items: cart.map(l => ({ name: l.name, size: l.size, extras: l.extras, qty: l.qty, unit: l.unit, note: l.note })),
      subtotal: +sub().toFixed(2), fee, tax, total, paid: false
    });
    localStorage.setItem("cn", name); localStorage.setItem("cp", phone);
    cart = []; saveCart(); render();
    $("modal").innerHTML = '<div class="back"><div class="sheet center"><h1>✅</h1><h3>Order sent!</h3><p>Your order number is <b>#' + number + '</b>.<br>' + esc(R.name) + ' will start preparing it.</p>' +
      (R.phone ? '<p class="muted">Questions? Call ' + esc(R.phone) + '</p>' : '') +
      '<button class="btn pri full" onclick="closeM()">Done</button></div></div>';
  } catch (e) {
    alert("Could not send your order. Please try again or call the restaurant.");
    $("pl").disabled = false; $("pl").textContent = "Place Order";
  }
};
</script>
</body>
</html>
