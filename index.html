<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Online | RESTO COMMANDE</title>
<meta name="description" content="Order online for pickup or delivery.">
<meta name="theme-color" content="#c8102e">
<style>
:root{--p:#c8102e;--bg:#faf7f2;--card:#fff;--tx:#1f1f1f;--mut:#6b6b6b;--bd:#e8e2d9}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:90px}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto}
.hero{min-height:220px;background:linear-gradient(135deg,#c8102e,#7a0a1c);color:#fff;display:flex;align-items:flex-end}
.hero .in{padding:18px;width:100%}
.hero h1{margin:0;font-size:28px}
.hero p{margin:6px 0 0;opacity:.92;font-size:14px}
.actions{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--p);color:#fff}
.btn.sec{background:#fff;color:var(--p);border:2px solid var(--p)}
.btn.full{width:100%}
.tabs{position:sticky;top:0;z-index:5;background:var(--card);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tabs a{white-space:nowrap;padding:7px 14px;border-radius:20px;background:#f0ebe3;color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
h2{margin:22px 16px 8px}
.item{display:flex;gap:12px;background:var(--card);margin:8px 12px;padding:12px;border-radius:14px;border:1px solid var(--bd);cursor:pointer}
.item .t{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--mut);display:block;margin:3px 0}
.item .pr{font-weight:700;color:var(--p)}
.thumb{width:80px;height:80px;border-radius:12px;background:#f0ebe3;display:flex;align-items:center;justify-content:center;font-size:38px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:var(--card);border-top:1px solid var(--bd);z-index:10}
.back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sheet h3{margin:0 0 8px}
label.opt{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
label.opt input{width:auto;margin:0 8px 0 0}
input,textarea{width:100%;padding:11px;border:1px solid #cfc8bd;border-radius:10px;font:inherit;margin:4px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:18px}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--bd);background:#fff;font-weight:600}
.seg button.on{border-color:var(--p);color:var(--p)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.muted{color:var(--mut)}
.center{text-align:center;padding:30px 16px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
</style>
</head>
